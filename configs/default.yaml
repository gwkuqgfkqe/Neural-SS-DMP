project:
  seed: 42
  output_dir: outputs
  device: auto

data:
  datasets: [m2]
  history_sec: 0.7
  horizon_sec: 0.5
  target_mode: within
  window_stride: horizon
  split:
    mode: block
    train_frac: 0.8
    val_frac: 0.1
    test_frac: 0.1
    block_sec: 10.0

  mouse:
    data_dir: data/mouse_track/data
    sample_rate_hz: 1000.0
    subjects: [fp]
    use_target: false
    bandpass:
      enabled: true
      low_hz: 1.0
      high_hz: 200.0
      order: 4

  m2:
    data_dir: data/M2/000953
    split: held-in-calib
    split_strategy: falcon
    falcon_split:
      train_split: held-in-calib
      test_split: held-out-calib
      val_frac: 0.2
    use_signal: spikes
    bin_size_sec: 0.02
    target: finger_pos
    spike_preprocess: falcon
    falcon_preprocess:
      exp_tau_sec: 0.05
      local_x_stats: true

  h1:
    data_dir: data/H1/000954
    split: held-in-calib
    split_strategy: falcon
    falcon_split:
      train_split: held-in-calib
      test_split: held-out-calib
      val_frac: 0.2
    use_signal: spikes
    bin_size_sec: 0.02
    target: openloop_pos
    spike_preprocess: falcon
    falcon_preprocess:
      exp_tau_sec: 0.05
      local_x_stats: true

  ajile12:
    data_dir: data/ajile12/000055
    subject_ids: ["01"]
    use_wrist: L_Wrist
    ecog_rate_hz: 500.0
    pose_rate_hz: 30.0
    target_rate_hz: 200.0
    bandpass:
      enabled: true
      low_hz: 1.0
      high_hz: 200.0
      order: 4
    norm_duration_sec: 60.0
    use_epochs_label: true
    allowed_epoch_labels:
      - Sleep/rest
      - Talk
      - TV
      - Computer/phone
      - Inactive
      - Other activity
    blocklist_prefix: "Blocklist"

  bci_iv:
    data_dir: data/BCI IV Dataset 4/BCICIV_4_mat
    subjects: [sub1]
    sample_rate_hz: 1000.0
    bandpass:
      enabled: true
      low_hz: 1.0
      high_hz: 200.0
      order: 4

preprocess:
  car: true
  bandpass:
    enabled: true
    low_hz: 1.0
    high_hz: 200.0
    order: 4
  notch:
    enabled: true
    freq_hz: 50.0
    q: 30.0
    harmonics: true
  standardize: true
  ecog_features: psd
  psd:
    mode: welch
    nperseg_sec: 0.1
    step_sec: 0.05
    log_power: true
    standardize: true
    bands:
      - [1.0, 4.0]
      - [4.0, 8.0]
      - [8.0, 12.0]
      - [12.0, 16.0]
      - [16.0, 20.0]
      - [20.0, 24.0]
      - [24.0, 28.0]
      - [28.0, 32.0]
      - [32.0, 36.0]
      - [36.0, 40.0]
      - [40.0, 44.0]
      - [44.0, 48.0]
      - [48.0, 52.0]
      - [52.0, 56.0]
      - [56.0, 60.0]
      - [60.0, 64.0]
      - [64.0, 68.0]
      - [68.0, 72.0]
      - [72.0, 76.0]
      - [76.0, 80.0]
      - [80.0, 84.0]
      - [84.0, 88.0]
      - [88.0, 92.0]
      - [92.0, 96.0]
      - [96.0, 100.0]
  target_standardize: true
  target_eps: 1.0e-6
  target_reconstruct:
    enabled: true
    method: savgol
    window_sec: 0.05
    polyorder: 3

model:
  input_type: spike
  encoder_type: conv_transformer
  input_dropout: 0.15
  hidden_size: 256
  num_layers: 1
  rnn_dropout: 0.15

  raw_encoder:
    encoder_type: conv_transformer
    input_dropout: 0.1
    hidden_size: 512
    num_layers: 4
    rnn_dropout: 0.1
    n_heads: 8
    attn_heads: 8
    ff_mult: 4
    conv_layers: 2
    conv_kernel: 5

  psd_encoder:
    encoder_type: transformer
    input_dropout: 0.15
    hidden_size: 384
    num_layers: 2
    rnn_dropout: 0.15
    n_heads: 8
    attn_heads: 8
    ff_mult: 3
    band_hidden: 24

  spike_encoder:
    encoder_type: conv_transformer
    input_dropout: 0.1
    hidden_size: 512
    num_layers: 4
    rnn_dropout: 0.1
    n_heads: 8
    attn_heads: 8
    ff_mult: 4
    conv_layers: 2
    conv_kernel: 5

  encoder:
    within_pool: query_attn
    attn_heads: 8

  dmp:
    n_basis: 10
    alpha_x: 1.0
    alpha_z: 25.0
    beta_z: 6.25
    tau_mode: fixed
    tau: 1.0
    basis_width_scale: 0.5
    basis_eps: 1.0e-3
    init_mode: predict

  subject_dynamics:
    enabled: true
    ridge_lambda: 1.0e-3
    w_ridge: 1.0e-3
    blend: 1.0
    learn: a_b
    mode: per_dim
    enforce_structure: false
    max_abs: null

train:
  batch_size: 64
  num_epochs: 40
  lr: 8.0e-4
  lr_schedule: cosine
  lr_min: 1.0e-6
  weight_decay: 3.0e-4
  grad_clip: 1.0
  log_every: 10
  num_workers: 0
  roll_init: false

loss:
  mode: full
  pos_weight: 1.0
  endpoint_weight: 0.0
  startpoint_weight: 0.0
  vel_weight: 0.05
  smooth_weight: 0.005
  w_weight: 0.0
  g_weight: 0.0
  wg_ridge: 1.0e-3

eval:
  roll_init: false
  metrics_agg: micro

viz:
  enabled: true
  save_every_epochs: 40
  per_epoch:
    samples:
      enabled: false
      num_examples: 6
      splits: [val, train]
    train_tail:
      enabled: true
      fraction: 1
      max_recordings: null
      smooth:
        enabled: true
        window_sec: 0.2
    mean_window:
      enabled: false
      splits: [val, train]
    full_sequence:
      enabled: true
      splits: [val]
      max_recordings: null
      smooth:
        enabled: true
        window_sec: 0.2
  test:
    mean_window: false
    full_sequence:
      enabled: true
      max_recordings: null
      smooth:
        enabled: true
        window_sec: 0.2

viz_controls:
  datasets: [m2, h1, bci_iv, mouse]
  split: test
  max_windows: 2500
  max_per_rec: 800
  seed: 7
  use_raw_target: false
  scatter_percentile: [2, 98]
  scatter_dim: 3
  f_norm: false
  window_stride_sec:
    bci_iv: 0.04
    mouse: 0.02

baselines:
  list: [linear, kalman, rnn_attn, lstm_attn, tcn, transformer]
  linear:
    pool_len_raw: 100
    pool_len_psd: 32
  kalman:
    ridge: 1.0e-3
  transformer:
    hidden_size: 256
    num_layers: 2
    n_heads: 4
    attn_heads: 4
    dropout: 0.1
    input_dropout: 0.1
    ff_mult: 4
  tcn:
    hidden_size: 256
    num_layers: 4
    kernel_size: 3
    dropout: 0.1
    input_dropout: 0.1
    attn_heads: 4
  lstm_attn:
    hidden_size: 256
    num_layers: 2
    rnn_dropout: 0.1
    input_dropout: 0.1
    attn_heads: 1
