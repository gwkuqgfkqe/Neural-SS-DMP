[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroscribe"
version = "0.1.0"
description = "NeuroScribe2.0: causal neural decoding with structured DMP constraints"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
